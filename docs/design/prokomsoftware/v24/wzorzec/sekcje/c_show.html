<!-- INDUSTRY SHOWROOM -->
<section id="demo" class="au-sec">
<div class="wrap">
<div style="text-align:center;max-width:820px;margin:0 auto 40px"><div class="au-eb">Kliknij swoją branżę</div><h2 class="au-h2">Tak może wyglądać Twoja strona albo system</h2><p class="au-lead" style="margin:14px 0 0">Wybierz, czym zajmuje się firma. Pokażemy stronę, wersję na telefon i system dopasowany do Twojej branży.</p></div>
<div class="au-shw">
<div class="au-indgrid" role="tablist" aria-label="Branża"><sc-for list="{{showInd}}" as="x" hint-placeholder-count="10"><button role="tab" class="{{x.cls}}" onClick="{{x.pick}}"><span class="ii"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{x.ic}}"></path></svg></span>{{x.t}}</button></sc-for></div>
<div class="au-glass au-stage">
<div class="au-stbar"><div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="ii"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{showIc}}"></path></svg></span><div style="min-width:0"><b style="display:block;font:800 15px Archivo;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{showName}}</b><span style="font-size:12px;color:var(--fg3)">{{showSub}}</span></div></div><div class="au-segs" role="tablist" aria-label="Widok"><sc-for list="{{showModes}}" as="m" hint-placeholder-count="3"><button role="tab" class="{{m.cls}}" onClick="{{m.pick}}">{{m.t}}</button></sc-for></div></div>
<div class="au-scr au-stscr"><div class="au-stglow"></div><div class="fadeSwap" key="{{showKey}}" style="position:absolute;inset:0"><div class="fit k-show" style="--fw:720px;--fh:470px"><dc-import name="Vis" kind="{{showKind}}" variant="{{showVar}}" phone="1" scale="1.06" h="470" hint-size="100%,100%"></dc-import></div></div></div>
<div class="au-stfoot"><div class="au-feats" key="{{showKey}}"><sc-for list="{{showFeat}}" as="f" hint-placeholder-count="4"><span><i>✓</i>{{f}}</span></sc-for></div><a class="au-btn" href="@P:kreator" onClick="{{showGo}}" style="min-height:46px">Policz dla tej branży →</a></div>
</div>
</div>
</div>
</section>
