<!doctype html>
<!--
  Obraz OG prokominstalacje.pl (1200 × 630, decyzja D6 = A: jeden obraz linii w panelu,
  `SiteSettings.seo.ogImage`). Źródło PNG: `node docs/design/prokominstalacje/og/render.mjs`.
  Kolory z tokenów motywu nocnego Instalacji (`src/styles/tokens.css`), kroje i logo z repo.
-->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../../../../src/app/(sites)/fonts/archivo-latin-ext-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
        unicode-range: U+0100-024F;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../../../../src/app/(sites)/fonts/archivo-latin-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('../../../../src/app/(sites)/fonts/manrope-latin-ext-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
        unicode-range: U+0100-024F;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('../../../../src/app/(sites)/fonts/manrope-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      :root {
        --bg: #101412; /* --c-instalacje-night-surface */
        --ink: #f4f5f1; /* --c-instalacje-night-ink */
        --ink-2: #b5bbb5; /* --c-instalacje-night-ink-2 */
        --accent: #12b6d8; /* --c-instalacje-night-accent */
        --accent-text: #4ccbe6; /* --c-instalacje-night-accent-text */
        --line: #2a302b; /* --c-instalacje-night-border */
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family: 'Manrope', sans-serif;
        background:
          radial-gradient(60% 70% at 85% 10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
          var(--bg);
      }
      .logo {
        height: 54px;
        width: auto;
        align-self: flex-start;
      }
      .eye {
        margin-top: 46px;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-text);
      }
      h1 {
        margin-top: 18px;
        font-family: 'Archivo', sans-serif;
        font-stretch: 120%;
        font-weight: 900;
        font-size: 60px;
        line-height: 1.04;
        max-width: 1000px;
      }
      h1 span {
        color: var(--accent-text);
      }
      .meta {
        margin-top: auto;
        display: flex;
        gap: 28px;
        font-size: 24px;
        font-weight: 700;
        color: var(--ink-2);
        position: relative;
        z-index: 1;
      }
      .meta b {
        color: var(--ink);
      }
      .ridge {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 1200px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <img class="logo" src="../../../../public/brand/prokom-instalacje_poziome_negatyw.svg" alt="" />
      <p class="eye">Instalacje na Podhalu</p>
      <h1>Monitoring, alarmy, sieci i&nbsp;smart&nbsp;home. <span>Od wizji lokalnej po serwis.</span></h1>
      <div class="meta">
        <span><b>prokominstalacje.pl</b></span>
        <span>Salon w Rabce-Zdroju</span>
        <span>24 mies. gwarancji na montaż</span>
      </div>
      <svg class="ridge" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
        <polygon
          points="0,200 0,120 110,80 190,104 300,46 380,88 470,60 560,104 660,38 760,84 850,62 950,106 1050,70 1140,96 1200,80 1200,200"
          fill="color-mix(in srgb, #2a302b 70%, transparent)"
        />
        <polygon
          points="0,200 0,158 90,128 170,150 270,104 360,140 450,118 550,156 640,112 740,150 830,126 930,160 1020,124 1110,152 1200,132 1200,200"
          fill="#2a302b"
        />
      </svg>
    </div>
  </body>
</html>
