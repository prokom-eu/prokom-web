<style>/* PRO-KOM Instalacje · wspólny arkusz wizualizacji (v2) */
.pk{--bg:#101412;--bg2:#151916;--bg3:#1B201C;--card:#191E1A;--card2:#1F251F;--line:#2A302B;--text:#F4F5F1;--muted:#B5BBB5;--soft:#D9DDD8;--accent:#12B6D8;--accentText:#4CCBE6;--accentInk:#06181C;--accentSoft:#0F272B;--accentLine:#1F4E57;--warn:#F2B84B;--ok:#7BD36A;--bad:#F07A6A;--glow:rgba(18,182,216,.36);--hdr:rgba(16,20,18,.8);--shadow:0 40px 90px -30px rgba(0,0,0,.8);--dot:rgba(244,245,241,.07);--ink:#0B1416;
  background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.55;transition:background .5s ease,color .5s ease;overflow-x:hidden;min-height:100vh}
.pk[data-theme="light"]{--bg:#F4F5F1;--bg2:#ECEEE8;--bg3:#E3E6DF;--card:#FFFFFF;--card2:#F7F8F5;--line:#DCDFD8;--text:#121613;--muted:#4F5650;--soft:#2E342F;--accent:#007A96;--accentText:#006A82;--accentInk:#FFFFFF;--accentSoft:#E1F2F6;--accentLine:#B6DDE6;--warn:#A86A00;--ok:#2E7A1E;--bad:#B3261E;--glow:rgba(0,122,150,.24);--hdr:rgba(244,245,241,.86);--shadow:0 36px 80px -30px rgba(20,60,70,.32);--dot:rgba(18,22,19,.08)}
.pk a{color:inherit;text-decoration:none}
.pk button{font-family:inherit}
.pk :focus-visible{outline:3px solid var(--accentText);outline-offset:3px}
.pk img{max-width:100%}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.disp{font-family:Archivo,sans-serif;font-stretch:122%;font-weight:900;letter-spacing:-.025em}
.h1{font-family:Archivo,sans-serif;font-stretch:122%;font-weight:900;letter-spacing:-.025em;font-size:clamp(40px,5vw,72px);line-height:.98;margin:0}
.h2{font-family:Archivo,sans-serif;font-stretch:115%;font-weight:900;letter-spacing:-.02em;font-size:clamp(32px,3.8vw,54px);line-height:1.02;margin:0}
.h3{font-family:Archivo,sans-serif;font-stretch:112%;font-weight:800;letter-spacing:-.015em;font-size:clamp(19px,1.8vw,24px);line-height:1.12;margin:0}
.lead{font-size:clamp(17px,1.4vw,20px);line-height:1.6;color:var(--muted);margin:0;max-width:62ch}

.ph{color:var(--warn);font-weight:800}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:16px;font-weight:800;font-size:16px;border:0;cursor:pointer;font-family:inherit;transition:transform .2s ease,box-shadow .2s ease,background .2s;color:var(--text);white-space:nowrap}

.btn-p:hover{transform:translateY(-2px);box-shadow:0 20px 44px -12px var(--glow)}
.pk .btn-g{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-g:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}

.sec{padding:104px 0}
.sec0{padding:0 0 104px}
.card{background:var(--card);border-radius:26px;box-shadow:inset 0 0 0 1px var(--line)}

.shead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 48px;margin-bottom:44px}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.kv span{font-size:14px;color:var(--muted)}
.note{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--bg3);font-size:14.5px;color:var(--soft)}

.note.w{background:rgba(242,184,75,.1);box-shadow:inset 0 0 0 1px rgba(242,184,75,.35)}
.note.w i{color:var(--warn)}
.dark{background:#0E1A1D;color:#F4F5F1;box-shadow:inset 0 0 0 1px #1F4E57}
.dark .lead,.dark .mut{color:#B5C7CB}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.tbl th,.tbl td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tbl td b{display:block}
.tblw{overflow-x:auto;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.yes{color:var(--ok);font-weight:800}.no{color:var(--bad);font-weight:800}
/* reveal */
.rv .ri{opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on .ri{opacity:1;transform:none}
.rv.on .ri:nth-child(2){transition-delay:.06s}.rv.on .ri:nth-child(3){transition-delay:.12s}.rv.on .ri:nth-child(4){transition-delay:.18s}.rv.on .ri:nth-child(5){transition-delay:.24s}.rv.on .ri:nth-child(6){transition-delay:.3s}.rv.on .ri:nth-child(7){transition-delay:.36s}.rv.on .ri:nth-child(8){transition-delay:.42s}.rv.on .ri:nth-child(9){transition-delay:.48s}.rv.on .ri:nth-child(10){transition-delay:.54s}
.in{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}.d4{animation-delay:.4s}.d5{animation-delay:.55s}.d6{animation-delay:.7s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(123,211,106,.55)}80%,100%{box-shadow:0 0 0 10px rgba(123,211,106,0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.7}100%{opacity:0;transform:translate(14px,-46px) scale(1.8)}}
@keyframes sweep{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes rise{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
/* topbar + header */
.topb{background:var(--bg2);border-bottom:1px solid var(--line);font-size:13px;position:relative;z-index:41}
.topw{padding-top:8px;padding-bottom:8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;color:var(--muted)}

.hdr{position:sticky;top:0;z-index:40;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

.mega{position:absolute;left:-24px;top:calc(100% + 14px);width:1080px;max-width:calc(100vw - 64px);background:var(--card);border-radius:24px;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);padding:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 300px;gap:22px;animation:fadein .25s ease}

.pipf{display:flex;justify-content:space-between;padding:8px 12px 10px;font-size:11.5px;color:#9FB0B4;font-weight:700}
/* scene */
.scene{--sky1:#5FAED3;--skyM:#A4D4E8;--sky2:#F2EEDF;--l0t:#A3BFCD;--l0b:#C9DBE3;--l1t:#82A3B1;--l1b:#A6BFCA;--l2t:#5C8276;--l2b:#86A49B;--l3t:#4F765C;--l3b:#7B9A80;--rim:rgba(255,255,255,.6);--fst:#3B6352;--fst2:#365A45;--mist:#FFFFFF;--mistA:.5;--aur:#FFE7BF;--aurA:.38;--fade:#EEF5F6;--fadeA:.8;--fadeM:.5;--mwA:0;--vlA:0;--rayA:.3;--cap:#FFFFFF;--mnt0:#C3D6DD;--mnt1:#A6BCC5;--mnt2:#89A1AB;--cap:#F7FAFB;--sun:#FFD27A;--gnd:#9CC48A;--gEL:#6F905F;--gER:#5D7C4F;--pav:#BDC1BA;--pline:#F4F5F1;--deck:#C99D6E;--woodL:#B67E4C;--woodR:#93613A;--plasL:#F1EEE6;--plasR:#D8D3C8;--metL:#BFC7CC;--metR:#9DA7AD;--glaL:#A8CCD7;--glaR:#86AEBA;--roofF:#5C4637;--roofB:#4A382C;--roofE:#30251D;--roofE2:#3C2E24;--top:#8F9791;--topIn:#7E857F;--win:#3F5662;--lit:#FFD27A;--door:#5B3A22;--gdoor:#CDD1CA;--balk:#7C5030;--balkT:#6A4428;--tree:#2F6B45;--tree2:#3C8155;--trk:#5B4030;--edge:rgba(20,30,25,.22);--zone:rgba(0,122,150,.8);--cloud:#FFFFFF;--chim:#6E6A64}
.scene.night{--sky1:#02060D;--skyM:#071526;--sky2:#123049;--l0t:#1D364B;--l0b:#10243A;--l1t:#152C3F;--l1b:#0D1F30;--l2t:#0F2334;--l2b:#0A1826;--l3t:#0B1925;--l3b:#07111A;--rim:rgba(150,205,235,.5);--fst:#0A1B27;--fst2:#07141E;--mist:#5FA0C8;--mistA:.13;--aur:#12B6D8;--aurA:.26;--fade:#040B14;--fadeA:.62;--fadeM:.36;--mwA:.17;--vlA:1;--rayA:0;--cap:#A9C0CF;--mnt0:#16283A;--mnt1:#1B2E3E;--mnt2:#152433;--cap:#B9C8D2;--gnd:#22342A;--gEL:#18261F;--gER:#132019;--pav:#2A312F;--pline:#6E7772;--deck:#4A3826;--woodL:#5C402A;--woodR:#47311F;--plasL:#6D6A64;--plasR:#56534E;--metL:#4E565B;--metR:#3E464A;--glaL:#2C4552;--glaR:#223844;--roofF:#2A211A;--roofB:#211A14;--roofE:#15100C;--roofE2:#1B1510;--top:#3B423E;--topIn:#323834;--win:#1A2830;--door:#2E1E12;--gdoor:#545A56;--balk:#3A2617;--balkT:#2F1F13;--tree:#14322A;--tree2:#1A3F30;--trk:#2A1E16;--edge:rgba(0,0,0,.4);--zone:rgba(18,182,216,.8);--cloud:#2A3B4C;--chim:#3A3733}
.scene.winter{--sky1:#94AEC0;--skyM:#C6D5DF;--sky2:#EFF3F5;--l0t:#DDE7ED;--l0b:#C6D5DE;--l1t:#BCCDD6;--l1b:#ABBECA;--l2t:#8AA1A6;--l2b:#B1C2C7;--l3t:#A6B9BF;--l3b:#C5D2D7;--rim:rgba(255,255,255,.85);--fst:#5F7A80;--fst2:#6E888D;--mist:#FFFFFF;--mistA:.6;--aur:#FFFFFF;--aurA:.32;--fade:#F2F6F7;--fadeA:.8;--fadeM:.5;--mwA:0;--vlA:0;--rayA:0;--cap:#FFFFFF;--mnt0:#D7E2E8;--mnt1:#BACAD3;--mnt2:#A2B4BE;--gnd:#EEF3F4;--gEL:#C4CFD4;--gER:#AFBCC2;--pav:#C8CED0;--deck:#D8DEE0;--roofF:#F3F7F8;--roofB:#DCE5E9;--top:#EEF3F5;--topIn:#DDE5E9;--tree:#2D5D45;--tree2:#38704F;--win:#3A4F5A;--edge:rgba(40,60,70,.22);--cloud:#F7FAFB}
.scene polygon{stroke:var(--edge);stroke-width:.6;stroke-linejoin:round;transition:fill .9s ease}
.gnd{fill:var(--gnd)}.gEL{fill:var(--gEL)}.gER{fill:var(--gER)}.pav{fill:var(--pav)}.pline{fill:var(--pline);stroke:none!important}.deck{fill:var(--deck)}
.fL.wood{fill:var(--woodL)}.fR.wood{fill:var(--woodR)}.fL.plas{fill:var(--plasL)}.fR.plas{fill:var(--plasR)}.fL.met{fill:var(--metL)}.fR.met{fill:var(--metR)}.fL.gla{fill:var(--glaL)}.fR.gla{fill:var(--glaR)}.fL.chim{fill:var(--chim)}.fR.chim{fill:var(--roofE)}.top.chim{fill:var(--roofE)}
.top{fill:var(--top)}.topIn{fill:var(--topIn)}.rF{fill:var(--roofF)}.rB{fill:var(--roofB)}.rE{fill:var(--roofE)}.rE2{fill:var(--roofE2)}
.win{fill:var(--win)}.win.lit{fill:var(--lit)}.win.big{fill:var(--glaL)}.win.big.lit{fill:#FFE3A3}
.door{fill:var(--door)}.gdoor,.gate{fill:var(--gdoor)}.balk{fill:var(--balk)}.balkT{fill:var(--balkT)}
.fL.car.k1{fill:#D24E3D}.fR.car.k1{fill:#AE3E30}.top.car.k1,.topIn.car.k1{fill:#E57060}
.fL.car.k2{fill:#4F6D85}.fR.car.k2{fill:#3D576B}.top.car.k2,.topIn.car.k2{fill:#6A889F}
.fL.car.k3{fill:#ECECE7}.fR.car.k3{fill:#CBCBC5}.top.car.k3,.topIn.car.k3{fill:#F7F7F3}
.fL.car.k4{fill:#3C423E}.fR.car.k4{fill:#2C312E}.top.car.k4,.topIn.car.k4{fill:#4E5550}
.fL.car.tr{fill:#F2F3F0}.fR.car.tr{fill:#D2D5D0}.top.car.tr,.topIn.car.tr{fill:#FAFBF9}
.fL.cab{fill:#2A3A44}.fR.cab{fill:#1F2D35}.top.cab,.topIn.cab{fill:#3A4C57}
.fL.post{fill:#EEF1EF}.fR.post{fill:#C9CFCB}.top.post,.topIn.post{fill:#FFFFFF}
.night .car{filter:brightness(.55)}
.tre{fill:var(--tree)}.tre2{fill:var(--tree2)}.trk{fill:var(--trk)}.tcap{fill:#FFFFFF;opacity:0;transition:opacity .9s}.winter .tcap{opacity:.95}
.mnt0{fill:var(--mnt0);transition:fill .9s}.mnt1{fill:var(--mnt1);transition:fill .9s}.mnt2{fill:var(--mnt2);transition:fill .9s}.cap{fill:var(--cap);transition:fill .9s}
.skyS{stop-color:var(--sky1)}.skyE{stop-color:var(--sky2)}
.sun{fill:var(--sun);opacity:.9;transition:opacity .9s}.night .sun,.winter .sun{opacity:0}
.sunh{fill:var(--sun);opacity:.18;transition:opacity .9s}.night .sunh,.winter .sunh{opacity:0}
.moon{fill:#E9EEF2;opacity:0;transition:opacity .9s}.night .moon{opacity:.95}
.star{fill:#FFFFFF;opacity:0}.night .star{opacity:.8;animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:.9}}
.cloud{fill:var(--cloud);opacity:.85;animation:drift 28s ease-in-out infinite alternate;transition:fill .9s}
.night .cloud{opacity:.5}
.c2{animation-duration:36s;animation-delay:-8s}.c3{animation-duration:44s;animation-delay:-20s}
.flk{fill:#FFFFFF;opacity:0}.winter .flk{opacity:.92;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
.skyM{stop-color:var(--skyM)}
.l0t{stop-color:var(--l0t)}.l0b{stop-color:var(--l0b)}.l1t{stop-color:var(--l1t)}.l1b{stop-color:var(--l1b)}.l2t{stop-color:var(--l2t)}.l2b{stop-color:var(--l2b)}.l3t{stop-color:var(--l3t)}.l3b{stop-color:var(--l3b)}
.mst0{stop-color:var(--mist);stop-opacity:0}.mst1{stop-color:var(--mist);stop-opacity:var(--mistA)}
.mw1{stop-color:#CFE3FF;stop-opacity:var(--mwA)}.mw0{stop-color:#CFE3FF;stop-opacity:0}
.au0{stop-color:var(--aur);stop-opacity:0}.au1{stop-color:var(--aur);stop-opacity:var(--aurA)}
.ry1{stop-color:#FFF4D8;stop-opacity:var(--rayA)}.ry0{stop-color:#FFF4D8;stop-opacity:0}
.fd1{stop-color:var(--fade);stop-opacity:var(--fadeA)}.fdm{stop-color:var(--fade);stop-opacity:var(--fadeM)}.fd0{stop-color:var(--fade);stop-opacity:0}
.mf{transition:fill .9s}
.rim{fill:none;stroke:var(--rim);stroke-width:1.2;stroke-linejoin:round;opacity:.9}.rim.r2{opacity:.35}
.crs{fill:none;stroke:var(--rim);stroke-width:1.6;stroke-linecap:round}
.fst{fill:var(--fst);transition:fill .9s}.fst2{fill:var(--fst2);transition:fill .9s}
.mist{animation:mistd 34s ease-in-out infinite alternate}.mist.m2{animation-duration:46s;animation-delay:-12s}.mist.m3{animation-duration:28s;animation-delay:-6s}
@keyframes mistd{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
.aur{opacity:.9;transform-box:view-box;transform-origin:720px 240px;animation:aur 16s ease-in-out infinite alternate}.aur.a2{animation-duration:22s;animation-delay:-7s;opacity:.6}
@keyframes aur{from{transform:translateX(-50px) scaleY(.85)}to{transform:translateX(50px) scaleY(1.15)}}
.mws{fill:#FFFFFF;opacity:0;transition:opacity .9s}.night .mws{opacity:.55;animation:tw 4s ease-in-out infinite alternate}
.vl{fill:#FFD27A;opacity:0;transition:opacity .9s}.night .vl{opacity:.85;animation:tw 3.6s ease-in-out infinite alternate}
.moonh{fill:#CFE3FF;opacity:0;transition:opacity .9s}.night .moonh{opacity:.12}
.rays{opacity:1;transform-box:view-box;transform-origin:830px 150px;animation:rays 24s ease-in-out infinite alternate}.night .rays,.winter .rays{opacity:0}
@keyframes rays{from{transform:rotate(-4deg)}to{transform:rotate(6deg)}}
.shoot{opacity:0}.night .shoot{animation:shoot 12s linear infinite;animation-delay:3s}
.shl{fill:none;stroke:#FFFFFF;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:120;opacity:.9}
@keyframes shoot{0%{opacity:0;transform:translate(1180px,30px) rotate(160deg)}1%{opacity:1}7%{opacity:0;transform:translate(780px,170px) rotate(160deg)}100%{opacity:0;transform:translate(780px,170px) rotate(160deg)}}
@media (prefers-reduced-motion: reduce){.mist,.aur,.rays,.shoot,.mws,.vl{animation:none!important}}
@keyframes fall{from{transform:translate(0,-40px)}to{transform:translate(-30px,900px)}}
.smk{fill:#E4E9EC;opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 4.5s ease-out infinite}
.night .smk{fill:#8A949A}
.sm2{animation-delay:1.5s}.sm3{animation-delay:3s}
.zone{fill:none;stroke:var(--zone)!important;stroke-width:1.6!important;stroke-dasharray:6 5}
.zone.arm{stroke:#F2B84B!important;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.cone{fill:#12B6D8;fill-opacity:.2;stroke:#12B6D8!important;stroke-opacity:.6;stroke-width:.8!important;animation:conef 3s ease-in-out infinite}
.cone.ir{fill:#7FE3F7;fill-opacity:.16}
@keyframes conef{0%,100%{fill-opacity:.12}50%{fill-opacity:.26}}
.cov{fill:#12B6D8;fill-opacity:.07;stroke:none}
.ring{fill:none;stroke:#12B6D8;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.7s ease-out infinite}
.r2{animation-delay:.9s}.r3{animation-delay:1.8s}
@keyframes ring{0%{opacity:0;transform:scale(.3)}25%{opacity:.8}100%{opacity:0;transform:scale(1)}}
.arc{fill:none;stroke:#12B6D8;stroke-width:1.8;stroke-linecap:round;opacity:0;animation:arc 1.8s ease-out infinite}
.a2{animation-delay:.3s}.a3{animation-delay:.6s}
@keyframes arc{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
.scrn{fill:#163844;stroke:#12B6D8!important;stroke-width:1!important}
.scrc{fill:#7FE3F7;opacity:.85;transition:opacity .5s}
.scrc.s1{fill:#FFD27A}.scrc.s2{fill:#B6F0FF}
.dv{animation:pop .45s cubic-bezier(.2,.7,.2,1)}
.dvb{fill:#0E1A1D;stroke:#12B6D8;stroke-width:1.6}
.dvi{fill:none;stroke:#8DE7F8;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.dvp{fill:none;stroke:#12B6D8;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:dvp 2.4s ease-out infinite}
@keyframes dvp{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.dv.arm .dvb,.dv.arm .dvp{stroke:#F2B84B}.dv.arm .dvi{stroke:#FFD89A}
.bubg{animation:pop .4s cubic-bezier(.2,.7,.2,1)}
.bub{fill:#0E1A1D;stroke:#12B6D8;stroke-width:1.2;opacity:.96}
.bubl{stroke:#12B6D8;stroke-width:1.2;stroke-dasharray:3 3}
.bubd{fill:#F2B84B}
.bubT{fill:#F4F5F1;font-family:Manrope,sans-serif;font-weight:800;font-size:12.5px}
.bubS{fill:#9FE6F5;font-family:Manrope,sans-serif;font-weight:600;font-size:10.5px}
.ttag rect{fill:#0E1A1D;stroke:#F2B84B;stroke-width:1}
.ttag text{fill:#FFD89A;font-family:Archivo,sans-serif;font-weight:800;font-size:11px}
.walker{animation:walk 14s ease-in-out infinite}
@keyframes walk{0%,8%{transform:translate(var(--x0),var(--y0))}46%,54%{transform:translate(var(--x1),var(--y1))}92%,100%{transform:translate(var(--x0),var(--y0))}}
.wkb{fill:#2A3A44}.night .wkb{fill:#C9D3D5}
.wkh{fill:#E8C7A6}.night .wkh{fill:#E6EBED}
.wks{fill:rgba(0,0,0,.18)}
.detb{fill:none;stroke:#7BD36A;stroke-width:1.4}
.night .detb{stroke:#F2B84B}
.detl{fill:#7BD36A}.night .detl{fill:#F2B84B}
.dett{fill:#06181C;font-family:Manrope,sans-serif;font-weight:800;font-size:8.5px}
/* brands */
.brands{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:10px}
.brand{min-height:66px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center;transition:box-shadow .2s}
.brand:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.brand b{font-family:Archivo,sans-serif;font-stretch:118%;font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--soft)}
.brand span{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* services grid (home) */
.svgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;grid-auto-flow:dense}
.svgrid .svc.hot{grid-column:span 2}
.svc{position:relative;display:flex;flex-direction:column;gap:14px;padding:26px;border-radius:26px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .25s ease,box-shadow .25s ease;overflow:hidden}
.svc:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1.5px var(--accent),var(--shadow)}
.svc .ico{transition:transform .35s ease}
.svc:hover .ico{transform:rotate(-6deg) scale(1.06)}
.svk{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.svc p{margin:0;color:var(--muted);font-size:15.5px}
.svf{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:800}
.svf span:first-child{color:var(--soft)}
.svc.hot{background:linear-gradient(160deg,var(--accentSoft),var(--card) 60%)}
.svart{height:120px;margin:-26px -26px 4px;background:var(--bg3);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.svart svg{width:100%;height:100%;display:block}
/* noclegowe tl */
.nocw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
.tl{padding:28px;display:flex;flex-direction:column;gap:22px}
.tlax{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;position:relative}
.tlax:before{content:"";position:absolute;left:4%;right:4%;top:23px;height:2px;background:var(--line)}
.tlb{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;color:var(--muted);font-weight:800;font-size:14px;padding:0 0 6px;min-height:44px}
.tlb i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);transition:all .25s}
.tlb.on{color:var(--text)}
.tlb.on i{background:var(--accent);color:var(--accentInk);box-shadow:0 0 0 6px var(--accentSoft)}
.tlc{border-radius:20px;background:var(--bg3);padding:24px;display:flex;flex-direction:column;gap:12px;min-height:200px;animation:fadein .35s ease}
.tlt{font-family:Archivo,sans-serif;font-stretch:120%;font-weight:900;font-size:44px;line-height:1;color:var(--accentText)}
.pack{padding:28px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(170deg,var(--accentSoft),var(--card) 55%)}
.pli{display:flex;gap:12px;align-items:flex-start;font-size:15.5px}
.pli i{width:34px;height:34px;border-radius:10px;background:var(--card);color:var(--accentText);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px var(--accentLine)}
.pli b{display:block}
.pli span{display:block;color:var(--muted);font-size:14px}
/* gory */
.gorband{position:relative;border-radius:30px;overflow:hidden;padding:56px 0 64px}
.gor{padding:26px;display:flex;flex-direction:column;gap:12px}
.gor p{margin:0;color:var(--muted);font-size:15.5px}
.gor .src{margin-top:auto}
/* smart phone */
.smw{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:56px;align-items:center}
.phone{width:340px;margin:0 auto;border-radius:44px;background:#0B0F0D;padding:12px;box-shadow:0 0 0 1.5px #2A302B,var(--shadow)}
.phs{border-radius:34px;background:#141A17;color:#F4F5F1;padding:22px 16px 18px;display:flex;flex-direction:column;gap:12px;min-height:560px}
.phh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#B5BBB5;font-weight:700}
.pht{font-family:Archivo,sans-serif;font-stretch:115%;font-weight:900;font-size:24px;line-height:1.05}
.phg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.tile{border-radius:18px;background:#1E2622;padding:13px;display:flex;flex-direction:column;gap:6px;transition:background .4s,box-shadow .4s}
.tile.on{background:#10313A;box-shadow:inset 0 0 0 1.5px #12B6D8}
.tile i{color:#8DE7F8}
.tile b{font-size:14px}
.tile span{font-size:12.5px;color:#B5BBB5}
.tile .big{font-family:Archivo,sans-serif;font-weight:900;font-size:26px;line-height:1;color:#F4F5F1}
.phn{border-radius:16px;background:#10313A;padding:12px 13px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:inset 0 0 0 1px #1F4E57;animation:fadein .35s ease}
.scb{display:flex;flex-direction:column;gap:10px}
.scbtn{display:flex;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:18px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;color:var(--text);font-family:inherit;transition:box-shadow .2s,background .2s;min-height:44px}
.scbtn:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.scbtn.on{background:var(--accentSoft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.scbtn b{display:block;font-size:16px}
.scbtn span span{display:block;font-size:14px;color:var(--muted)}
/* objects */
.objgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.obj{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s,box-shadow .2s;min-height:180px}
.obj:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1.5px var(--accent)}
.obj b{font-size:16.5px;line-height:1.25}
.obj span{font-size:13.5px;color:var(--muted);line-height:1.45}
/* steps */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.step{padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.stn{font-family:Archivo,sans-serif;font-stretch:120%;font-weight:900;font-size:40px;line-height:1;color:var(--accentText)}
.step p{margin:0;font-size:14.5px;color:var(--muted)}
.odb{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:30px;padding:34px;border-radius:28px;background:#0E1A1D;color:#F4F5F1;box-shadow:inset 0 0 0 1px #1F4E57}
.odb .lead{color:#B5C7CB}
.odl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.odi{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:rgba(18,182,216,.08);box-shadow:inset 0 0 0 1px rgba(18,182,216,.25);font-size:14.5px}
.odi i{color:#4CCBE6;flex:none}
/* plans */
.plan{padding:28px;display:flex;flex-direction:column;gap:14px}
.plan.hot{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.plan li{display:flex;gap:10px;font-size:15px}
.plan li i{color:var(--accentText);flex:none;margin-top:2px}
.prc{font-family:Archivo,sans-serif;font-stretch:115%;font-weight:900;font-size:28px}
.take{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px;padding:26px 30px;border-radius:24px;background:var(--bg3)}
/* realizacje */
.rl{display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,box-shadow .2s}
.rl:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1.5px var(--accent)}
.rlimg{height:190px;position:relative;background:var(--bg3);overflow:hidden}
.rlimg svg{width:100%;height:100%;display:block}
.rlb{padding:20px;display:flex;flex-direction:column;gap:8px}
.rlb>span{font-size:14px;color:var(--muted)}
/* faq */
.faqw{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.fq{border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px}
.fq summary{list-style:none;cursor:pointer;padding:20px 22px;font-weight:800;font-size:17px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.fq summary::-webkit-details-marker{display:none}
.fq summary em{font-style:normal;font-family:Archivo,sans-serif;font-weight:900;color:var(--accentText);font-size:15px;flex:none;width:34px}
.fq summary span{flex:1}
.fq p{margin:0;padding:0 22px 20px 70px;color:var(--muted);font-size:15.5px}
.fq[open]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.sticky{position:sticky;top:96px}
/* forms */
.zpw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.zp{padding:30px;display:flex;flex-direction:column;gap:22px}
.zpq{display:flex;flex-direction:column;gap:12px}
.zpq h3{margin:0;font-size:16px;font-weight:800;display:flex;gap:10px;align-items:center}
.zpq h3 em{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accentInk);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.zpc{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 12px;border-radius:13px;border:0;background:var(--bg3);color:var(--soft);font-weight:800;font-size:14px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;font-family:inherit}
.chip em{font-style:normal;width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--line);font-size:13px;line-height:1}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.on{background:var(--accentSoft);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.on em{background:var(--accent);color:var(--accentInk)}
.fl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--soft)}
.zin{width:100%;box-sizing:border-box;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;padding:0 16px}
textarea.zin{padding:14px 16px;min-height:120px;resize:vertical}
.zin:focus{outline:none;border-color:var(--accent)}
.zsum{padding:26px;display:flex;flex-direction:column;gap:14px}
.zsl{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.zsl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.zsl div span{color:var(--muted)}
.drop{border:2px dashed var(--accentLine);border-radius:20px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--accentSoft)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.consent input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:6px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--accent)}
/* contact cards */
.ctc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ct{padding:22px;display:flex;flex-direction:column;gap:8px}
.ct b{font-size:17px}
.ct span{font-size:14px;color:var(--muted)}
/* page hero (subpages) */
.phero{position:relative;overflow:hidden;padding:36px 0 72px}
.phero .hgrid{position:absolute;inset:0;background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%);pointer-events:none}
.phero .hglow{position:absolute;width:760px;height:620px;right:-6%;top:-10%;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,var(--glow),transparent 66%);opacity:.6;pointer-events:none}
.phw{position:relative;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:48px;align-items:center;margin-top:22px}
.pht2{display:flex;flex-direction:column;gap:22px}
.phv{min-width:0}
.ill{position:relative;border-radius:30px;overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.illbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.illb{padding:16px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg3);flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 10px -4px rgba(0,0,0,.4)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.anchors{position:sticky;top:76px;z-index:20;background:var(--hdr);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.anchors .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:8px}
.anchors .wrap::-webkit-scrollbar{display:none}
.anchors a{white-space:nowrap;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:800;color:var(--muted)}
.anchors a:hover{color:var(--text);background:var(--bg3)}
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.pkg{padding:28px;display:flex;flex-direction:column;gap:14px;position:relative}
.pkg.hot{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.pkg .badge{position:absolute;top:-12px;left:24px;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--accentInk);font-size:12.5px;font-weight:800}
.pkg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.pkg li{display:flex;gap:10px;font-size:15px}
.pkg li i{color:var(--accentText);flex:none;margin-top:2px}
.pkg .prc span{font-size:15px;color:var(--muted);font-weight:700}
.prep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prep div{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--bg3);font-size:14.5px}
.prep div i{color:var(--accentText);flex:none}
.rel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.relc{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s,box-shadow .2s}
.relc:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1.5px var(--accent)}
.relc span{font-size:13.5px;color:var(--muted)}
.cta{position:relative;overflow:hidden;border-radius:32px;padding:56px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;background:#0E1A1D;color:#F4F5F1;box-shadow:inset 0 0 0 1px #1F4E57}
.cta .lead{color:#B5C7CB}
.cta:after{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(18,182,216,.35),transparent 65%);filter:blur(30px);pointer-events:none}
.cta>*{position:relative;z-index:1}
/* widgets: NVR */
.nvr{background:#0A1214;color:#E6EEF0;border-radius:24px;overflow:hidden;box-shadow:inset 0 0 0 1px #1F3A40,var(--shadow)}
.nvrh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12.5px;font-weight:800;letter-spacing:.04em;border-bottom:1px solid #1A2B2F;gap:10px;flex-wrap:wrap}
.nvrh .rec{color:#F07A6A;display:inline-flex;align-items:center;gap:6px}
.nvrh .rec:before{content:"";width:8px;height:8px;border-radius:50%;background:#F07A6A;animation:blink 1.2s infinite}
.nvrg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;background:#05090A;padding:3px}
.nvrg.one{grid-template-columns:1fr}
.cam{position:relative;background:#111C1F;cursor:pointer;border:0;padding:0;display:block;width:100%;font-family:inherit;color:inherit;text-align:left}
.cam svg{display:block;width:100%;height:auto}
.cam .cl{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
.cam .ct2{position:absolute;right:8px;top:8px;font-size:10.5px;font-weight:700;color:#C9D3D5;background:rgba(0,0,0,.45);padding:3px 6px;border-radius:6px}
.cam.sel{outline:2px solid #12B6D8;outline-offset:-2px}
.ir svg{filter:grayscale(1) contrast(1.15) brightness(1.08)}
.nvrt{padding:12px 16px 14px;border-top:1px solid #1A2B2F}
.tline{position:relative;height:34px;border-radius:8px;background:#111C1F;overflow:hidden}
.tline i{position:absolute;top:6px;bottom:6px;width:5px;border-radius:3px;background:#12B6D8}
.tline i.p{background:#F2B84B}
.tline b{position:absolute;top:0;bottom:0;width:2px;background:#fff;animation:scan 9s linear infinite}
@keyframes scan{from{left:0}to{left:100%}}
.tlx{display:flex;justify-content:space-between;font-size:10.5px;color:#8FA3A8;margin-top:6px}
.mask{fill:#1F2B2E}
.mask.on{fill:#0A1214;stroke:#F2B84B;stroke-width:1.2;stroke-dasharray:4 3}
/* widgets: floor plan */
.fp{width:100%;height:auto;display:block}
.fp .wall{fill:none;stroke:var(--soft);stroke-width:3}
.fp .room{fill:var(--card2);stroke:var(--line);stroke-width:1}
.fp .room.on{fill:var(--accentSoft)}
.fp .lbl{fill:var(--muted);font-family:Manrope,sans-serif;font-weight:800;font-size:11px}
.fp .big{fill:var(--text);font-family:Archivo,sans-serif;font-weight:900;font-size:16px}
.heat{opacity:.75;transition:opacity .6s}
.sens{fill:var(--accent)}
.sens.al{fill:#F2B84B;animation:pulse 1s infinite}
/* widgets: building section */
.bsec .fl0{fill:var(--card2);stroke:var(--line)}
.bsec .riser{stroke:#12B6D8;stroke-width:3;stroke-linecap:round}
.bsec .fib{stroke:#F2B84B;stroke-width:2;stroke-dasharray:6 4;animation:dash 1.6s linear infinite}
.bsec .lbl{fill:var(--muted);font-family:Manrope,sans-serif;font-weight:800;font-size:11px}
/* widgets: mixer */
.mix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ch{border-radius:18px;background:var(--bg3);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fader{width:14px;height:150px;border-radius:8px;background:var(--line);position:relative;overflow:hidden}
.fader i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--accent),var(--accentText));border-radius:8px;transition:height .4s}
.vu{display:flex;gap:3px;align-items:flex-end;height:40px}
.vu i{width:6px;border-radius:2px;background:var(--accent);transform-origin:bottom;animation:rise .6s ease-in-out infinite alternate}
.ch input[type=range]{width:100%;accent-color:var(--accent)}
/* widgets: screen preview */
.tv{border-radius:20px;background:#05090A;padding:14px;box-shadow:inset 0 0 0 1px #1F3A40,var(--shadow)}
.tvs{border-radius:10px;overflow:hidden;background:#0E1A1D;aspect-ratio:16/9;position:relative;color:#F4F5F1}
.tvs.port{aspect-ratio:9/16;max-width:300px;margin:0 auto}
/* widgets: ev */
.evbar{height:16px;border-radius:999px;background:var(--bg3);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.evbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accentText));transition:width .5s}
.range{width:100%;accent-color:var(--accent)}
/* map */
.map{width:100%;height:auto;display:block}
.map .town{fill:var(--accent)}
.map .tl2{fill:var(--text);font-family:Manrope,sans-serif;font-weight:800;font-size:12px}
.map .road{fill:none;stroke:var(--line);stroke-width:2.5}
.map .zone2{fill:var(--accentSoft);stroke:var(--accentLine);stroke-width:1.2}
/* footer */
.ftr{background:var(--bg2);border-top:1px solid var(--line);padding:64px 0 34px;font-size:14.5px}
.fg{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));gap:30px}
.fg h4{margin:0 0 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fg a{display:block;padding:4px 0;color:var(--soft)}
.fg a:hover{color:var(--accentText)}
.fbot{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}
.bnav{display:none}
/* responsive */
@media (max-width:1100px){
  .nav,.desk{display:none!important}
  .mobb{display:inline-flex}
  .svgrid,.g3,.plans,.pkgs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nocw,.smw,.faqw,.zpw,.odb,.split,.phw,.cta{grid-template-columns:1fr}
  .objgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4,.rel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brands{grid-template-columns:repeat(6,minmax(0,1fr))}
  .fg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sticky{position:static}
  .hxt{width:auto;max-width:640px}
  .hxbar{position:relative;right:auto;top:auto;align-items:flex-start;margin-top:24px}
  .hxstat{position:relative;left:auto;bottom:auto;width:auto;margin-top:16px}
  .hxchips{position:relative;left:auto;right:auto;bottom:auto;margin-top:12px}
  .pip{position:relative;right:auto;top:auto;width:auto;margin-top:16px}
  .hx{min-height:0}
  .hxin{min-height:0;padding-bottom:40px}
  .hxsvg{position:relative;height:auto;margin-top:18px}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .sec{padding:64px 0}.sec0{padding:0 0 64px}
  .topb{display:none}
  .hdrw{min-height:64px}
  .anchors{top:64px}
  .h1{font-size:38px}
  .hxin{padding:20px 16px 32px}
  .hxt{gap:16px;padding-top:4px}
  .hxt h1{font-size:52px}
  .hxs{font-size:15px;margin-bottom:10px}
  .hxt .lead{font-size:16.5px}
  .hxt .btn{width:100%}
  .htrust{font-size:13px;gap:8px 14px}
  .hotabs{overflow-x:auto;max-width:100%;scrollbar-width:none}
  .hotabs::-webkit-scrollbar{display:none}
  .hxbar{width:100%}
  .hmodes{width:100%;box-sizing:border-box}
  .hmode{flex:1;justify-content:center}
  .hxl{grid-template-columns:1fr}
  .hchip{font-size:13px}
  .hchipx{margin-left:0;width:100%}
  .svgrid,.g2,.g3,.plans,.odl,.ctc,.pkgs,.prep,.mix{grid-template-columns:1fr}
  .mix{grid-template-columns:repeat(2,minmax(0,1fr))}
  .svgrid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
  .svgrid::-webkit-scrollbar{display:none}
  .svc{flex:0 0 84%;scroll-snap-align:start}
  .svc:hover{transform:none}
  .objgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .obj{min-height:0;padding:16px}
  .obj span{display:none}
  .steps{grid-template-columns:1fr;gap:10px}
  .step{flex-direction:row;align-items:flex-start;gap:16px;padding:18px}
  .stn{font-size:30px;min-width:44px}
  .tlax{grid-template-columns:repeat(6,minmax(64px,1fr));overflow-x:auto}
  .tlb i{width:40px;height:40px}
  .tlt{font-size:34px}
  .tl,.pack,.zp,.zsum,.plan,.gor,.pkg,.pad,.feat{padding:20px}
  .phone{width:300px}
  .phs{min-height:500px}
  .brands{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brand.hm{display:none}
  .g4,.rel{grid-template-columns:1fr 1fr;gap:10px}
  .fg{grid-template-columns:1fr 1fr;gap:22px}
  .fg>div:first-child{grid-column:1/-1}
  .shead{margin-bottom:28px}
  .odb{padding:22px}
  .take{padding:20px}
  .cta{padding:28px;border-radius:24px}
  .fq summary{padding:16px;font-size:16px}
  .fq p{padding:0 16px 16px}
  .fq summary em{display:none}
  .mhide{display:none!important}
  .phero{padding:20px 0 48px}
  .phw{gap:24px;margin-top:14px}
  .gorband{padding:36px 0 40px;border-radius:24px}
  .gorband>div{padding:0 16px!important}
  .ftr{padding-bottom:110px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:var(--hdr);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line),0 18px 40px -16px rgba(0,0,0,.6);padding:6px}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border-radius:16px;font-size:11.5px;font-weight:800;color:var(--muted)}
  .bnav a.act{color:var(--text)}
  .bnav a.mid{background:var(--accent);color:var(--accentInk);margin:-14px 4px 0;box-shadow:0 12px 26px -10px var(--glow)}
}
@media (prefers-reduced-motion:reduce){
  .pk *{animation:none!important;transition:none!important}
  .rv .ri,.in{opacity:1!important;transform:none!important}
  .winter .flk,.smk{opacity:0!important}
}
/* ===== SUBPAGES v2 ===== */
.phero .h1{font-size:clamp(38px,4.1vw,60px);line-height:1}
.pkv{display:flex;flex-wrap:wrap;gap:28px;padding-top:6px}
.pkv .kv b{font-size:34px}
.srcbox{margin-top:40px;padding:22px 24px;border-radius:20px;background:var(--bg3);font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.srcbox b{color:var(--soft);font-size:14px}
.srcbox ol{margin:0;padding-left:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}
.srcbox a{color:var(--accentText);text-decoration:underline;text-underline-offset:2px}
.segd{display:flex;gap:3px;padding:3px;border-radius:11px;background:#05090A;box-shadow:inset 0 0 0 1px #1A2B2F}
.segd button{min-height:34px;padding:0 11px;border-radius:8px;border:0;background:transparent;color:#9FB0B4;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.segd button.on{background:#12B6D8;color:#06181C}
.tgl{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:0 12px 0 8px;border-radius:11px;border:0;background:#111C1F;color:#C9D3D5;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;box-shadow:inset 0 0 0 1px #1F3A40}

/* dla kogo */
.araudw{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:22px;align-items:stretch}
.araudl{display:flex;flex-direction:column;gap:14px;padding:6px 0}
.araudtabs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.araud{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:18px;border:0;cursor:pointer;background:var(--card);color:var(--text);font:800 16px Manrope,sans-serif;text-align:left;box-shadow:inset 0 0 0 1px var(--line);transition:all .2s}

.araudr{padding:36px;display:flex;flex-direction:column;gap:18px;background:radial-gradient(70% 80% at 100% 0%,var(--accentSoft),transparent 70%),var(--card)}
.araudp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.araudp>div{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;font-weight:700;line-height:1.45}
/* liczby */
.arlz{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.arlzc{position:relative;padding:22px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.arlzc::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--hc)}

.arlzc b{font-family:Archivo,sans-serif;font-stretch:118%;font-weight:900;font-size:34px;line-height:1.05;color:var(--hc);letter-spacing:-.01em}
.arlzt{font-size:13.5px;font-weight:800;color:var(--text)}
.arlzc p{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
/* deweloperzy */
.ardvb{position:relative;padding:48px;border-radius:34px;color:#F4F5F1;background:radial-gradient(60% 70% at 100% 0%,#0F3A44 0%,transparent 70%),radial-gradient(50% 60% at 0% 100%,#16301F 0%,transparent 70%),#081113;box-shadow:inset 0 0 0 1px rgba(76,203,230,.18);overflow:hidden;--card:#0E1A1D;--line:rgba(255,255,255,.09);--muted:#93A6AB;--soft:#C5D2D5;--text:#F4F5F1;--bg2:#0B1618;--bg3:#152226;--accentText:#4CCBE6;--accentSoft:#0F2A30;--accent:#12B6D8;--accentInk:#06181C}

.ardvd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}
.ardvd>div{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ardvd b{font-family:Archivo,sans-serif;font-stretch:118%;font-weight:900;font-size:34px;color:#4CCBE6;line-height:1;flex:none}
.ardvd span{font-size:13.5px;color:#B5C4C8;line-height:1.4}
.ardvw{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}
.ardvtabs{display:flex;flex-direction:column;gap:6px}
.ardvt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:0;cursor:pointer;background:transparent;color:#B5C4C8;font:800 15px Manrope,sans-serif;text-align:left;transition:all .2s}
.ardvt:hover{background:rgba(255,255,255,.05);color:#fff}
.ardvt.on{background:#12B6D8;color:#06181C}
.ardvp{padding:28px;border-radius:24px;background:#0E1A1D;box-shadow:inset 0 0 0 1px rgba(76,203,230,.2);display:flex;flex-direction:column;gap:18px}
.ardvph{display:flex;gap:14px;align-items:center}
.ardvi{width:52px;height:52px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;background:rgba(18,182,216,.15);color:#4CCBE6;flex:none}
.ardvl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ardvl>div{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);font-size:15px;font-weight:600;line-height:1.45}
.ardvwhy{padding:16px 18px;border-radius:16px;background:rgba(242,184,75,.08);box-shadow:inset 0 0 0 1px rgba(242,184,75,.3);display:flex;flex-direction:column;gap:4px}
.ardvwhy em{font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#F2B84B}
.ardvwhy span{font-size:15px;color:#E6ECEE;line-height:1.5}
.ardvf{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-top:22px;border-top:1px solid rgba(255,255,255,.1)}
.ardvf span{max-width:70ch;font-size:14.5px;color:#A9BCC0}
/* doświadczenie */
.arexkv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.arexkv>div{padding:22px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px}
.arexkv b{font-family:Archivo,sans-serif;font-stretch:118%;font-weight:900;font-size:40px;line-height:1;color:var(--accentText)}
.arexkv span{font-size:14px;color:var(--muted)}
.arexg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px}
.arexr,.arexb{padding:28px;display:flex;flex-direction:column;gap:16px}
.arexl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arexl>div{padding:14px;border-radius:14px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:2px}
.arexl b{font-size:15px}.arexl span{font-size:13px;color:var(--muted)}
.arexbr{display:flex;flex-wrap:wrap;gap:8px}
.arexbr span{padding:9px 13px;border-radius:12px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);font:800 14px Archivo,sans-serif;font-stretch:112%;color:var(--soft)}
/* biblioteka */
.arlibc{padding:22px;display:flex;flex-direction:column;gap:10px}
.arlibc p{margin:0;color:var(--muted);font-size:14.5px}
.arlibs{margin-top:auto;font-size:12.5px;font-weight:800;color:var(--warn)}
.arlibe{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.arlibg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.arlibx{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,transform .2s}
.arlibx:hover{box-shadow:inset 0 0 0 1.5px var(--accent);transform:translateY(-2px)}
.arlibx>span{display:flex;flex-direction:column;gap:2px}.arlibx b{font-size:14.5px}.arlibx>span>span{font-size:13px;color:var(--muted)}
.arlibx em{font-style:normal;font-size:12px;font-weight:800;color:var(--accentText);white-space:nowrap}
@media (max-width:1100px){.araudw,.ardvw,.arexg{grid-template-columns:1fr}.arlz,.arlibg{grid-template-columns:1fr 1fr}.ardvd{grid-template-columns:1fr}.arexkv{grid-template-columns:1fr 1fr}.ardvtabs{flex-direction:row;flex-wrap:wrap}}
@media (max-width:760px){
  .araudtabs{flex-direction:row;overflow-x:auto;margin:8px -16px 0;padding:0 16px 6px;scrollbar-width:none}.araud{flex:none;font-size:14px;padding:8px 12px 8px 8px}.araud>svg:last-child{display:none}
  .araudr{padding:22px}.araudp{grid-template-columns:1fr}
  .arlz{grid-template-columns:1fr 1fr;gap:10px}.arlzc{padding:16px}.arlzc b{font-size:26px}.arlzc p{font-size:13px}
  .ardvb{padding:22px;border-radius:24px;margin:0 -4px}.ardvtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.ardvt{flex:none;padding:10px 12px;font-size:14px}.ardvl{grid-template-columns:1fr}.ardvp{padding:18px}
  .arexkv b{font-size:30px}.arexl{grid-template-columns:1fr}.arlibg{grid-template-columns:1fr}
  .arlibo{display:grid!important;grid-template-columns:1fr!important;margin:0!important;padding:0!important}
}
/* nowe rozwiązania v2 */
.arnf .chip em{background:var(--card);color:var(--muted);font-size:11.5px;width:auto;min-width:20px;padding:0 5px;margin-left:2px}
.arnf .chip.on em{background:var(--accent);color:var(--accentInk)}
.arnx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;align-items:start}
.arnxl{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:820px;overflow-y:auto;padding:2px 6px 2px 2px;scrollbar-width:thin}
.arnwi{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:18px;border:0;cursor:pointer;background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);font-family:inherit;transition:box-shadow .2s,transform .2s,background .2s}
.arnwi:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hc) 60%,transparent)}
.arnwi.on{background:var(--card2);box-shadow:inset 0 0 0 2px var(--hc),0 18px 40px -28px var(--hc)}
.arnwth{width:76px;height:64px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:radial-gradient(80% 90% at 30% 20%,color-mix(in srgb,var(--hc) 26%,transparent),transparent 75%),var(--bg2)}
.arnwth svg{width:92%;height:92%}
.arnwth path,.arnxa path{fill:none;stroke:var(--hc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.arnwtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.arnwm{display:flex;gap:6px;align-items:center}
.arnwm em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--hc)}
.arnwm .arty{position:static;padding:2px 7px;font-size:10.5px}
.arnwtx b{font-size:14.5px;line-height:1.25}
.arnwk{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arnxd{position:sticky;top:130px;border-radius:28px;overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.arnxa{position:relative;height:200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 90% at 30% 10%,color-mix(in srgb,var(--hc) 30%,transparent),transparent 70%),linear-gradient(180deg,var(--bg2),var(--card));border-bottom:1px solid var(--line);animation:fadein .35s ease}
.arnxa svg{height:84%;width:auto}
.arnxa .arty{position:absolute;left:18px;top:18px}
.arnxpos{position:absolute;right:18px;top:18px;font-size:12px;font-weight:800;color:var(--muted);background:var(--card);padding:5px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.arnxb{padding:26px;display:flex;flex-direction:column;gap:16px}
.arnxt{font-size:clamp(22px,2.1vw,30px)}
.arnxdsc{margin:0;color:var(--soft);font-size:16px;line-height:1.6}
.arnxsp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arnxsp>div{padding:12px 14px;border-radius:14px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:2px}
.arnxsp span{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.arnxsp b{font-size:15px;line-height:1.35}
.arnxpl{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;background:color-mix(in srgb,var(--hc) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 30%,transparent)}
.arnxpl em{display:inline-flex;align-items:center;gap:8px;font-style:normal;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--hc)}
.arnxpl p{margin:0;display:flex;gap:10px;font-size:14.5px;line-height:1.5;color:var(--text)}
.arnxpl .arok{width:20px;height:20px;border-radius:6px;background:var(--hc);margin-top:1px}
.arnxm{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.arnxm>div{display:flex;flex-direction:column;gap:6px}
.arnxm em{font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.arnxm>div>span{font-size:14.5px;font-weight:700}
.arnxdl{display:flex;flex-wrap:wrap;gap:6px}
.arnxf{display:flex;align-items:center;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.pk[data-theme="light"] .arnwm em,.pk[data-theme="light"] .arnxpl em,.pk[data-theme="light"] .arnxd .eye{color:color-mix(in srgb,var(--hc) 60%,#000)!important}
@media (max-width:1100px){.arnx{grid-template-columns:1fr}.arnxd{position:static;order:-1}.arnxl{max-height:none;grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .arnxl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 10px;gap:10px;scrollbar-width:none;max-height:none}
  .arnwi{flex:0 0 78%;scroll-snap-align:start}
  .arnxa{height:150px}.arnxb{padding:20px}.arnxsp,.arnxm{grid-template-columns:1fr}

.artlw{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:26px;padding-top:6px}
.artlline{position:absolute;left:8px;right:8px;top:14px;height:2px;background:linear-gradient(90deg,var(--line),var(--accent),var(--line))}

.artl b{font:900 17px Archivo,sans-serif;font-stretch:115%;color:var(--text)}
.artl.now b{color:var(--accentText)}
.artl span{font-size:12.5px;color:var(--muted);line-height:1.35}

.arprst{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px}
.arprst.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.arprst.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.arprst.mut{color:var(--muted);background:var(--bg3)}
.arprd2{font:800 13px Archivo,sans-serif;color:var(--muted)}
.arprp{margin-top:auto;padding:12px 14px;border-radius:14px;background:var(--accentSoft);display:flex;flex-direction:column;gap:3px}
.arprp em{font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accentText)}
.arprp span{font-size:14.5px;font-weight:700;line-height:1.45}
@media (max-width:1100px){.artlw{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px}.artlline{display:none}}
@media (max-width:760px){.artlw{display:flex;overflow-x:auto;margin:0 -16px 20px;padding:6px 16px 6px;scrollbar-width:none}.artl{flex:0 0 46%}.arprz{grid-template-columns:1fr}}
.arnxl>*{min-width:0}.arnwi{min-width:0;width:100%}.arnwth{width:58px;height:54px}
.arhmv .ars .arcore{grid-template-columns:1fr}.arhmv .ars .arcore .arinfo{border-left:0;border-top:1px solid var(--line)}.arhmv .ars .arinfog{grid-template-columns:1fr 1fr!important}.arhmv .ars .arspec{grid-column:span 2!important}.arhmv .arlayers{display:none}

  .arsvgw{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}

}

  arScene(c, o, set) {
    // o: { m: 'kl'|'ty'|'in', hs, off: [] }
    const HU = c.HU, P = c.P, HS = this.arHotspots(), off = o.off || [], SP = this.arSpecs();
    const vis = HS.map((h, i) => i).filter((i) => !off.includes(HS[i].k));
    const hs = vis.includes(o.hs) ? o.hs : (vis[0] || 0);
    const cur = HS[hs] || HS[0];
    const SN = { kam: 'Monitoring', alarm: 'Alarm i domofon', kd: 'Kontrola dostępu', wifi: 'Sieć i Wi-Fi', smart: 'Smart home', snd: 'Dźwięk', scr: 'Ekrany i TV', ant: 'Anteny', ev: 'Ładowarka EV', tel: 'Teletechnika' };
    const M = [['kl', 'Gotowy dom', P.home], ['ty', 'Przed tynkami', P.tool], ['in', 'Wszystkie instalacje', P.layers]];
    const LB = { kl: 'Tak widzi to klient. Ile instalacji tu jest?', ty: 'Przed tynkami: puszki, ramki, rury i trasy kabli', in: 'Wszystkie instalacje i trasy do szafy rack' };
    const step = (d) => { const k = vis.indexOf(hs); const n = vis[(k + d + vis.length) % vis.length]; set({ m: o.m === 'kl' ? 'in' : o.m, hs: n }); };
    return {
      m: o.m, cls: 'ars m-' + o.m + off.map((k) => ' off-' + k).join(''),
      modes: M.map((x) => ({ n: x[1], ic: x[2], cls: 'armode' + (o.m === x[0] ? ' on' : ''), on: o.m === x[0] ? 'true' : 'false', go: () => set({ m: x[0] }) })),
      lbl: LB[o.m],
      hs: HS.map((h, i) => ({ n: i + 1, tr: 'translate(' + h.x + ' ' + h.y + ')', st: '--hc:' + HU[h.k], cls: 'arhs L-' + h.k + (i === hs ? ' on' : ''), t: h.t, go: () => set({ m: o.m === 'kl' ? 'in' : o.m, hs: i }) })),
      layers: Object.keys(SN).map((k) => { const on = !off.includes(k); return { n: SN[k], st: '--hc:' + HU[k], cls: 'arsys sm' + (on ? ' on' : ''), on: on ? 'true' : 'false', go: () => set({ off: on ? off.concat([k]) : off.filter((x) => x !== k) }) }; }),
      allL: () => set({ off: [] }),
      cur: { n: hs + 1, t: cur.t, v: cur.v, p: cur.p, s: SP[cur.s] || 'Parametry dobieramy do projektu.', svc: SN[cur.k], etap: 'Etap: ' + cur.e, st: '--hc:' + HU[cur.k] },
      prev: () => step(-1), next: () => step(1)
    };
  }
