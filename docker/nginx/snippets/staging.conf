# Staging: never indexed (also files and the API, not only HTML) and behind a password.
# The password file lives only on the server (docs/wdrozenia.md), never in the repo.
auth_basic "PRO-KOM staging";
auth_basic_user_file /etc/nginx/auth/staging.htpasswd;
add_header X-Robots-Tag "noindex, nofollow" always;
