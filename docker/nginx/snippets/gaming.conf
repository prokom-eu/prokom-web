# PRO-KOM Gaming (repo prokom-gaming, ADR-G001 there): the site and the Payload panel on ONE domain
# (/admin), plus the public paths of Umami (ADR-G009). Expects `$app` (the app container) and
# `$umami` (its stack's Umami) to be set by the server block.
client_max_body_size 1m; # Next server actions (forms, panel photos ≤ 900 KB); uploads below

include /etc/nginx/snippets/headers-common.conf;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

location / {
  include /etc/nginx/snippets/proxy.conf;
}

# Panel and Payload REST: image uploads.
location /admin {
  client_max_body_size 20m;
  include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
  client_max_body_size 20m;
  include /etc/nginx/snippets/proxy.conf;
}

# While `users` is empty Payload lets anyone create the first admin. Closed for good here; the
# first admin is made through an SSH tunnel to the app's loopback port (prokom-gaming runbook).
location = /admin/create-first-user {
  return 404;
}

location = /api/users/first-register {
  return 404;
}

# Forms and customer accounts: the app limits per IP too; this stops floods before Node.
location = /api/inquiry {
  limit_req zone=inquiry burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}

location /api/konto/ {
  limit_req zone=inquiry burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}

location = /api/health {
  limit_req zone=health burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}

# Umami: only the tracker and its collect endpoint are public (the script sends to the directory it
# was loaded from, i.e. /_s/api/send). Umami's own panel stays behind an SSH tunnel.
location = /_s/script.js {
  set $app $umami;
  rewrite ^/_s(/.*)$ $1 break;
  include /etc/nginx/snippets/proxy.conf;
}

location = /_s/api/send {
  set $app $umami;
  rewrite ^/_s(/.*)$ $1 break;
  include /etc/nginx/snippets/proxy.conf;
}
