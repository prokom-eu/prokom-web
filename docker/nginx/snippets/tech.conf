# PRO-KOM Tech (prokomserwis.pl, repo prokom-system, docs/tech/WDROZENIE.md there): everything goes
# to the stack's internal router `gateway` (nginx without TLS), which splits Django and Next.
# Expects `$app` (the gateway container) to be set by the server block.
#
# No headers-common.conf here on purpose: Django already sends HSTS (includeSubDomains, preload),
# X-Frame-Options and nosniff, and Next its own headers — a second HSTS or X-Frame-Options from
# this proxy would be a duplicate header (same as on the old Hetzner server).

# Photos uploaded in the service panel, for the whole vhost.
client_max_body_size 20m;

location / {
  # X-Forwarded-Proto $scheme (proxy.conf): Django has SECURE_SSL_REDIRECT and trusts it.
  include /etc/nginx/snippets/proxy.conf;
}
