# The admin panel domain (Payload). Expects `$app`.
client_max_body_size 20m; # image uploads

include /etc/nginx/snippets/headers-common.conf;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

location / {
  include /etc/nginx/snippets/proxy.conf;
}

# The panel uses REST only; GraphQL mutations (loginUser, forgotPasswordUser, batches) would go
# around the per-IP login limit below (audit AB4).
location ~ ^/api/graphql(-playground)?$ {
  return 404;
}

location ~ ^/api/users/(login|forgot-password|reset-password|unlock)$ {
  limit_req zone=login burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}

location = /api/health {
  limit_req zone=health burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}
