# A site domain (tenant pages). Expects `$app` (upstream) and `$panel_origin` (the panel that
# embeds the live preview) to be set by the server block.
client_max_body_size 64k; # forms only; the app refuses inquiry bodies over 32 KB anyway

# Base CSP: directives that cannot break Next's inline scripts. `script-src` with a nonce is
# a later step (docs/STAN.md).
include /etc/nginx/snippets/headers-common.conf;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

location / {
  include /etc/nginx/snippets/proxy.conf;
}

# Live preview: the panel shows the page in an iframe (S5), so only the panel may frame it.
location /podglad/ {
  include /etc/nginx/snippets/headers-common.conf;
  add_header Content-Security-Policy "frame-ancestors $panel_origin; base-uri 'self'; object-src 'none'; form-action 'self'" always;
  include /etc/nginx/snippets/proxy.conf;
}

location = /api/inquiry {
  limit_req zone=inquiry burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}

location = /api/health {
  limit_req zone=health burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}
