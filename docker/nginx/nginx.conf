# Reverse proxy for every stack on the server (ADR-004, S9b): production and staging apps,
# TLS from Let's Encrypt. Server blocks: templates/*.conf.template (domains from the proxy's
# environment, see docker/compose.proxy.yml).

worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # One JSON line per request on stdout, like the app's logs. `$uri` has no query string:
  # preview tokens (`/podglad?token=…`) and anything else in a query stay out of the logs.
  log_format json escape=json
    '{"time":"$time_iso8601","requestId":"$request_id","host":"$host",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"upstream":"$upstream_response_time","ip":"$remote_addr"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # App containers are found by name on the shared `prokom-proxy` network when a request comes,
  # not at start: nginx starts even while one of the stacks is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Health is public (monitoring) but each call asks the database: a small per-IP budget.
  limit_req_zone $binary_remote_addr zone=health:1m rate=1r/s;
  # Forms: the app limits inquiries per IP too (5 / 10 min); this stops floods before Node.
  limit_req_zone $binary_remote_addr zone=inquiry:1m rate=10r/m;
  limit_req_status 429;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # Hosts that are not ours (scanners, an IP in the address bar, an old DNS record): no answer
  # and no certificate. The app would answer 404 anyway; this keeps them away from Node.
  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
  }

  # Only our rendered templates; the image's own conf.d/default.conf (welcome page) is not used.
  include /etc/nginx/sites/*.conf;
}
