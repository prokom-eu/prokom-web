# Pytania doprecyzowujące (szablon „Prośba o szczegóły”) — inne dla każdej linii.
pytania:
  biznes: |
    - jaka to działalność i ile stanowisk sprzedaży lub komputerów ma obsłużyć,
    - z jakiego programu lub kasy korzystają Państwo dziś (jeśli z jakiegoś),
    - czy potrzebny jest terminal płatniczy albo połączenie z księgowością,
    - na kiedy wszystko ma działać.
  instalacje: |
    - jaki to obiekt (dom, pensjonat, firma, wspólnota) i mniej więcej jaka powierzchnia,
    - co ma działać — np. ile kamer i gdzie, alarm, Wi-Fi w całym budynku, sterowanie,
    - czy budynek jest w budowie, czy wykończony (od tego zależy prowadzenie kabli),
    - jakie łącze internetowe jest w obiekcie.
  software: |
    - czym zajmuje się firma i kto ma korzystać ze strony lub systemu (klienci, pracownicy),
    - co ma się wydarzyć po wejściu klienta — telefon, zapytanie, rezerwacja, zamówienie,
    - czy jest już strona, domena albo program, z którym trzeba się połączyć,
    - na kiedy chcieliby Państwo wystartować i czy jest założony budżet.
  prokom: |
    - czego dotyczy sprawa — sprzęt i programy dla firmy, instalacja w obiekcie, strona lub system, czy naprawa,
    - czy to firma, instytucja, czy sprawa prywatna,
    - gdzie ma być wykonana praca albo dostawa (miejscowość),
    - na kiedy to potrzebne.
  tech: |
    - jakie to urządzenie (marka i dokładny model — np. z naklejki albo z ustawień),
    - co dokładnie się dzieje i od kiedy (czy było upuszczone albo zalane),
    - czy urządzenie się włącza,
    - czy wolą Państwo przynieść sprzęt do punktu, czy wysłać kurierem.
