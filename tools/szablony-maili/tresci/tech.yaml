- id: konto
  grupa: gt7
  nazwa: "Konto klienta — przypisanie naprawy"
  skrot: konto
  kiedy: "Klient chce widzieć naprawę w koncie (historia, numer przesyłki). Ścieżka /claim-repair."
  tresc: |
    Dzień dobry,

    naprawę można dodać do konta klienta — wtedy w jednym miejscu jest historia napraw, statusy i numer przesyłki.

    ::kroki Jak to zrobić
    1. Zalogować się albo założyć konto na **prokomserwis.pl** (Konto).
    2. Wybrać „Przypisz naprawę” i wpisać numer zgłoszenia **{I:numer}** oraz 4 ostatnie cyfry telefonu.
    3. Gotowe — naprawa pojawi się na liście.

    Konto nie jest wymagane — status można sprawdzać też bez logowania: {STATUS_URL}

    Pozdrawiamy serdecznie,

