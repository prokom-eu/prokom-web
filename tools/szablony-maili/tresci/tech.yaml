    Urządzenie: {I:urządzenie}
    Naprawa z dnia: {I:data naprawy}
    Gwarancja: {I:okres} — {S:status|w gwarancji;do sprawdzenia}
    Opis: {I:co się dzieje}

    ::kroki Co dalej
    1. Prosimy przynieść lub wysłać urządzenie — punkt: {S_PUNKT}.
    2. Sprawdzimy, czy usterka wynika z naprawy (np. część), czy z nowego uszkodzenia.
    3. Decyzję przekażemy najpóźniej do **{I:data (max 14 dni)}**. Jeśli to nasza wina — naprawimy bez kosztów.

    Pozdrawiamy serdecznie,

# ───────── Dane, Hammer Glass, konto ─────────
- id: dane-kopia
  grupa: gt7
  nazwa: "Dane w urządzeniu — kopia zapasowa przed naprawą"
  skrot: kopia
  kiedy: "Przed naprawą, przy której dane mogą zostać utracone (np. płyta główna, reset). [SZEF] treść o danych zgodna z praktyką serwisu (tech-spec §12.9)."
  tresc: |
    Dzień dobry,

    przy tej naprawie ({I:rodzaj naprawy}) istnieje ryzyko utraty danych w urządzeniu. Zanim zaczniemy:

    ::lista
    - jeśli urządzenie działa — prosimy o kopię zapasową (zdjęcia, kontakty, dokumenty) w chmurze albo na komputerze,
    - jeśli nie działa, a dane są ważne — możemy najpierw spróbować je odzyskać (wycena osobno),
    - prosimy o informację, czy możemy przystąpić do naprawy bez kopii.

    ::info Dane w serwisie
    Do urządzenia zaglądamy tylko w zakresie potrzebnym do naprawy i testu.

    Pozdrawiamy serdecznie,

