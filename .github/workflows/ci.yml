# CI: every PR to develop/main and every push to them must pass this.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Full e2e on develop every night: a PR runs only the e2e of the line it changes (see
  # `changes`), so a break across lines shows up here by the morning.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run (the night run has its own group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # What does the PR touch? A docs-only PR skips e2e; pushes to develop/main always run
  # the e2e job (there: seed · build only, see below). `docs/design/` is not documentation here:
  # the seed reads its images.
  #
  # Which e2e: a PR whose code files all belong to lines (Biznes, Software, Instalacje — their
  # folders in LINE_*) runs the e2e of those lines plus the shared ones (tests/e2e/*.spec.ts
  # without a line prefix). Any other file (components, collections, shared lib, config,
  # dependencies) runs all of them. Unit test files (*.test.ts) do not pick e2e: the checks job
  # runs them. LINE_SHARED = files in a line's folder that code of every line imports
  # (SectionRail, RenderBlocks): they run all e2e too. A break across lines that slips through
  # shows up in the night run.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
      e2e: ${{ steps.diff.outputs.e2e }}
      phone: ${{ steps.diff.outputs.phone }}
      shards: ${{ steps.diff.outputs.shards }}
      total: ${{ steps.diff.outputs.total }}
    steps:
      # The PR's merge commit and its first parent (the current base) are enough for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: diff
        env:
          DOCS_ONLY: '^(docs/|\.claude/)|\.md$'
          ALWAYS_CODE: '^docs/design/'
          UNIT_TEST: '\.test\.ts$'
          LINE_SHARED: '^src/lib/(software/smoothScroll|biznes/pages/)'
          LINE_BIZNES: '^(src/sites/biznes/|src/app/\(sites\)/\[domain\]/\(biznes\)/|src/lib/biznes/|seed/prokombiznes/|src/seed/biznes/|src/seed/shared/biznes\.ts|docs/design/prokombiznes/|tests/e2e/biznes-)'
          LINE_SOFTWARE: '^(src/sites/software/|src/app/\(sites\)/\[domain\]/(\(software\)|%5Fsoftware)/|src/lib/software/|seed/prokomsoftware/|src/seed/software/|src/seed/shared/software\.ts|docs/design/prokomsoftware/|tests/e2e/software-)'
          LINE_INSTALACJE: '^(src/sites/instalacje/|src/app/\(sites\)/\[domain\]/\(instalacje\)/|src/lib/instalacje/|seed/prokominstalacje/|src/seed/instalacje/|src/seed/shared/instalacje\.ts|docs/design/prokominstalacje/|tests/e2e/instalacje/|src/styles/tokens-instalacje)'
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            { echo "code=true"; echo "e2e=all"; echo "phone=true"; echo "shards=[1,2,3,4,5,6,7,8]"; echo "total=8"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a file moved from src/ to docs/ also lists its old path.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          echo "$files"
          code=$( { echo "$files" | grep -Ev "$DOCS_ONLY"; echo "$files" | grep -E "$ALWAYS_CODE"; } | sort -u || true)
          if [ -n "$files" ] && [ -z "$code" ]; then
            echo "Only documentation changed: e2e skipped."
            { echo "code=false"; echo "shards=[1]"; echo "total=1"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"

          lines=""
          full=false
          while IFS= read -r f; do
            if [ -z "$f" ] || echo "$f" | grep -Eq "$UNIT_TEST"; then continue
            elif echo "$f" | grep -Eq "$LINE_SHARED"; then echo "Shared by all lines, all e2e: $f"; full=true
            elif echo "$f" | grep -Eq "$LINE_BIZNES"; then lines="$lines biznes"
            elif echo "$f" | grep -Eq "$LINE_SOFTWARE"; then lines="$lines software"
            elif echo "$f" | grep -Eq "$LINE_INSTALACJE"; then lines="$lines instalacje"
            else echo "Not a line file, all e2e: $f"; full=true
            fi
          done <<< "$code"
          if [ "$full" = true ] || [ -z "$code" ]; then
            { echo "e2e=all"; echo "phone=true"; echo "shards=[1,2,3,4,5,6,7,8]"; echo "total=8"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          specs=$(git ls-files tests/e2e | grep '\.spec\.ts$')
          selected=$(echo "$specs" | grep -E '^tests/e2e/[^/]+$' | grep -Ev '^tests/e2e/(biznes|software)-' || true)
          phone=false
          for line in $(echo "$lines" | tr ' ' '\n' | sort -u); do
            echo "Line changed: $line"
            case "$line" in
              biznes) selected="$selected"$'\n'$(echo "$specs" | grep '^tests/e2e/biznes-' || true) ;;
              software) selected="$selected"$'\n'$(echo "$specs" | grep '^tests/e2e/software-' || true) ;;
              instalacje) selected="$selected"$'\n'$(echo "$specs" | grep '^tests/e2e/instalacje/' || true); phone=true ;;
            esac
          done
          echo "e2e=$(echo "$selected" | grep . | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          # One line's e2e (~60 tests a shard at 8) fit in 4 shards: 7 runners per PR instead of
          # 11, so 2–3 PRs at once do not wait for runners (20 parallel jobs on the free plan).
          { echo "shards=[1,2,3,4]"; echo "total=4"; } >> "$GITHUB_OUTPUT"

  # Fast feedback (~2 min): most mistakes show up here, next to the slower e2e job. Gitleaks runs
  # here too, not as its own job: every job of a PR waits for a free runner (20 at once on the
  # free plan), so fewer jobs means less waiting when several PRs run (08.11: up to 10 min).
  # There is no separate „build · e2e” summary job either: it waited up to 3 min for a runner to
  # check the shards for 3 s. Branches have no protection rules, so no check name is required.
  checks:
    name: lint · typecheck · test · gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://prokom:prokom@127.0.0.1:5432/prokom_web
      PANEL_HOST: panel.localhost
      GITLEAKS_VERSION: 8.30.1
      # SHA256 of gitleaks_<version>_linux_x64.tar.gz from the release checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks: a secret removed in a later commit is still a leak

      # The checked binary is cached per version (outside the working tree, so lint and Prettier
      # never see it): a release download that stalls (08.11) happens once per version.
      - id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gitleaks-bin
          key: gitleaks-bin-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      # Binary instead of gitleaks-action: the action needs a paid license for organizations.
      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Retry transient GitHub errors (e.g. 504); --retry-all-errors needs curl >= 7.71 (24.04 ships 8.5).
          # --max-time: a stalled transfer fails and is retried instead of hanging to the job limit.
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 60 -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check --strict
          mkdir -p ~/gitleaks-bin
          tar -xzf "$RUNNER_TEMP/$archive" -C ~/gitleaks-bin gitleaks
          ~/gitleaks-bin/gitleaks version

      - name: Gitleaks — scan repository history
        run: ~/gitleaks-bin/gitleaks git --redact --no-banner --verbose .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm in the exact version from package.json "packageManager".
      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Throwaway secret generated per run, so no secret-looking value lives in the repo.
      - name: Test-only environment
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The image is built without seed/, docs/ and tests/ (.dockerignore), and `next build` there
      # type-checks with tsconfig.build.json. Same check here, so a file of the image that imports
      # one of those folders fails the PR, not the image build after the merge.
      - name: Typecheck as in the image
        run: |
          mkdir -p "$RUNNER_TEMP/outside-image"
          mv seed docs tests "$RUNNER_TEMP/outside-image/"
          pnpm exec tsc -p tsconfig.build.json --noEmit
          mv "$RUNNER_TEMP/outside-image/"* .

      - name: Unit tests
        run: pnpm test

  # E2E in parallel shards (`playwright --shard`), each with its own database and server, so
  # the tests that edit content never meet. Tests are split one by one (fullyParallel in CI).
  # Target: a PR green in ~7 min. All e2e take ~38 min on one worker; each shard adds ~2 min of
  # set-up (install, seed snapshot, build). All e2e: 8 shards (11 runners per PR); one line's
  # e2e: 4 shards (7 runners) — `changes` picks it. The free plan runs 20 jobs at once.
  #
  # A push to develop/main runs one job without Playwright: fresh seed, snapshot save and build.
  # Why: the merged PR already passed full e2e on its merge commit, and 6 shards per merge filled
  # the plan's limit of parallel jobs, so the next PRs waited minutes for a runner. The one job
  # still catches a seed bug a stale snapshot could hide, and it saves the seed snapshot and
  # `.next/cache` that PR runs restore. Risk: two PRs green on their own can break together
  # after squash — the next PR's CI (merge commit with current develop) or staging shows it.
  e2e:
    name: ${{ github.event_name == 'push' && 'seed · build (no e2e on push)' || format('e2e ({0}/{1})', matrix.shard, needs.changes.outputs.total) }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || needs.changes.outputs.shards) }}

    # Database for the build and Playwright (same version as docker/compose.dev.yml).
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: prokom
          POSTGRES_PASSWORD: prokom
          POSTGRES_DB: prokom_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prokom -d prokom_web"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Catches inquiry e-mails for Playwright (same version as docker/compose.dev.yml).
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://prokom:prokom@127.0.0.1:5432/prokom_web
      PANEL_HOST: panel.localhost
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      MAIL_FROM_ADDRESS: formularz@example.test
      # At most 2 gallery photos per product (384 of 567): e2e needs the first, B6 thumbnails a second.
      SEED_GALLERY_LIMIT: '2'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm in the exact version from package.json "packageManager".
      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Browser and apt caches are keyed by the Playwright version, not the whole lockfile: any
      # dependency bump used to miss them, and every shard downloaded Chromium again (08.11: one
      # download stalled for 11 min).
      - name: Playwright version
        id: pw
        if: github.event_name != 'push'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Chromium of the pinned Playwright version; system libraries are installed every time.
      - id: playwright-cache
        if: github.event_name != 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # A stalled download is cut after 150 s and tried again (up to 3 times).
      - name: Install Playwright (Chromium only)
        if: github.event_name != 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 9
        run: |
          for attempt in 1 2 3; do
            timeout 150 pnpm exec playwright install chromium && exit 0
            echo "Chromium download failed or stalled (attempt $attempt), trying again."
          done
          exit 1

      # System libraries for Chromium come from apt. The Ubuntu mirror is sometimes very slow
      # (8–12 min instead of ~12 s), so the downloaded .deb files are cached: apt keeps them in
      # ~/apt-archives (its own directory, so the runner's clean-up does not delete them) and
      # installs from disk next time. Killing a slow apt does not help — it keeps the dpkg lock.
      - id: apt-cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: apt-playwright-${{ runner.os }}-

      # apt runs in the background while the database and the build are prepared; the
      # "Wait for…" step below collects its result. Its log and exit code go to ~/apt-deps.*.
      - name: Start Playwright system dependencies (background)
        if: github.event_name != 'push'
        run: |
          mkdir -p ~/apt-archives/partial
          printf '%s\n' \
            "Dir::Cache::Archives \"$HOME/apt-archives\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          nohup bash -c 'pnpm exec playwright install-deps chromium > ~/apt-deps.log 2>&1; echo $? > ~/apt-deps.exit' >/dev/null 2>&1 &

      # The seeded database and its media are cached: a fresh seed takes ~4 min (the Biznes
      # catalog) and depends only on these inputs. `base` = migrations and dependencies, `key` =
      # base + the seed's data. A pull request restores only the exact snapshot (a PR that does
      # not touch the seed gets the one develop saved). No fallback to an older snapshot: parts of
      # the seed skip records that exist (settings of Instalacje, Software, some of Biznes), so a
      # seed over an older snapshot keeps old content and fails the e2e of the changed data. A
      # push to develop/main and the night run always seed fresh and save it.
      - name: Seed snapshot key
        id: snapshot
        run: |
          base="seed-${{ runner.os }}-v2-${{ hashFiles('pnpm-lock.yaml', 'src/migrations/**') }}-g${{ env.SEED_GALLERY_LIMIT }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "key=$base-${{ hashFiles('src/seed/**', 'seed/**', 'src/collections/**', 'src/globals/**', 'src/payload.config.ts', 'docs/design/**/media/**') }}" >> "$GITHUB_OUTPUT"

      # Throwaway values generated per run, so no secret-looking value lives in the repo. The
      # admin password is derived from the snapshot base: a restored database keeps the admin of
      # the run that seeded it (the seed does not change an existing admin), and the e2e tests
      # log in with it.
      - name: Test-only environment
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$(printf '%s' '${{ steps.snapshot.outputs.base }}' | sha256sum | cut -c1-32)" >> "$GITHUB_ENV"

      - id: snapshot-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/seed-snapshot
          key: ${{ steps.snapshot.outputs.key }}

      - name: Restore seeded database
        if: steps.snapshot-cache.outputs.cache-hit == 'true'
        run: |
          echo "Snapshot: ${{ steps.snapshot.outputs.key }}"
          docker exec -i ${{ job.services.postgres.id }}             pg_restore -U prokom -d prokom_web --no-owner --exit-on-error < ~/seed-snapshot/db.dump
          tar -xf ~/seed-snapshot/media.tar

      # ADR-009: push is disabled, so the empty CI database gets its schema from migrations only.
      # Skipped after a restore: the snapshot key covers src/migrations, so it is up to date.
      - name: Migrate database
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: pnpm payload migrate

      # Tenants biznes / instalacje / software on *.localhost — the e2e tests depend on them.
      - name: Seed database
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: pnpm seed

      # One shard saves the snapshot for the next runs (the others seeded the same inputs).
      - name: Save seeded database
        if: steps.snapshot-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        run: |
          mkdir -p ~/seed-snapshot
          docker exec ${{ job.services.postgres.id }}             pg_dump -U prokom -d prokom_web -Fc > ~/seed-snapshot/db.dump
          tar -cf ~/seed-snapshot/media.tar media
          ls -lh ~/seed-snapshot

      - if: steps.snapshot-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/seed-snapshot
          key: ${{ steps.snapshot.outputs.key }}

      # Next's build cache: unchanged modules are not compiled again. Restored from the newest
      # run when the sources changed (the usual case); a stale cache only costs a full build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The restored cache also holds `unstable_cache` data of an earlier run's database (catalog
      # index, site map): with stale-while-revalidate the first request would get it. Only the
      # compiled modules are worth keeping.
      - name: Drop cached data of earlier runs
        run: rm -rf .next/cache/fetch-cache

      - name: Build
        run: pnpm build

      - name: Wait for Playwright system dependencies
        if: github.event_name != 'push'
        timeout-minutes: 15
        run: |
          until [ -f ~/apt-deps.exit ]; do sleep 2; done
          cat ~/apt-deps.log
          [ "$(cat ~/apt-deps.exit)" = 0 ]
          # apt wrote the files as root; the cache step reads them as the runner user.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - if: github.event_name != 'push' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # On the build above (`pnpm start`, playwright.config.ts): no route compiling on first visit.
      # Two runs, each split into the same shards: Playwright cuts the list by test count in file
      # order, so the ~40 slow phone tests of Instalacje (~11 min) would all land in one shard.
      # Split on their own they add ~1.5–3 min to every shard instead.
      - name: E2E tests (shard ${{ matrix.shard }}/${{ needs.changes.outputs.total }})
        if: github.event_name != 'push'
        env:
          E2E_SERVER: start
          E2E_FILES: ${{ needs.changes.outputs.e2e }}
          E2E_PHONE: ${{ needs.changes.outputs.phone }}
          PHONE_TESTS: 'Instalacje on a phone:'
        run: |
          files=""
          [ "$E2E_FILES" = all ] || files="$E2E_FILES"
          # $files unquoted on purpose: one argument per spec file.
          pnpm test:e2e --shard=${{ matrix.shard }}/${{ needs.changes.outputs.total }} --pass-with-no-tests --grep-invert "$PHONE_TESTS" $files
          if [ "$E2E_PHONE" = true ]; then
            pnpm test:e2e --shard=${{ matrix.shard }}/${{ needs.changes.outputs.total }} --pass-with-no-tests --grep "$PHONE_TESTS" tests/e2e/instalacje/telefon
          fi

      - name: Upload Playwright report
        if: github.event_name != 'push' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
