# Performance budget (S10, docs/jakosc.md): after every successful staging deploy, Lighthouse
# (mobile, 3 runs, median run) on the home page and one subpage of each site. Budget:
# Performance, Accessibility, Best Practices, SEO ≥ 90, LCP ≤ 2.5 s, CLS ≤ 0.1 — over budget =
# red run, which blocks a production deploy (runbook §3). Staging sends noindex on purpose, so
# the SEO audit "is-crawlable" is skipped. Pages: lighthouserc.json. Reports: artifact
# "lighthouse". Staging is behind basic auth: a separate login only for this — secret
# STAGING_BASIC_AUTH holds the ready base64 token (`staging-login.sh lighthouse`, runbook §1.9),
# so GitHub masks exactly the value that goes into the header. Reports are uploaded without it.

name: Lighthouse

on:
  workflow_run:
    workflows: [Deploy staging]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: lighthouse-staging
  cancel-in-progress: true # only the newest staging matters

permissions:
  contents: read

jobs:
  lighthouse:
    name: budget · staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # collect → upload → assert as separate steps: `autorun` skips the reports when the budget
      # fails, and a red run is exactly when they are needed.
      - name: Lighthouse — collect
        env:
          BASIC_TOKEN: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          # The login goes into a copy of lighthouserc.json: a settings flag on the command line
          # replaces `settings` from the file (1.11: skipAudits was lost, SEO 0.78 for noindex).
          jq --arg auth "Basic $BASIC_TOKEN" '.ci.collect.settings.extraHeaders = {Authorization: $auth}' \
            lighthouserc.json > "$RUNNER_TEMP/lighthouserc.json"
          npx --yes @lhci/cli@0.15.1 collect --config="$RUNNER_TEMP/lighthouserc.json"
          rm -f "$RUNNER_TEMP/lighthouserc.json"

      - name: Reports without the staging login
        if: always()
        run: |
          npx --yes @lhci/cli@0.15.1 upload || true
          # A report keeps its settings (extraHeaders = the login); the HTML embeds the same data.
          shopt -s nullglob
          for f in .lighthouseci/reports/*.json; do
            jq 'del(.configSettings.extraHeaders)' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          rm -f .lighthouseci/reports/*.html
          if grep -rl 'Basic ' .lighthouseci/reports; then
            echo '::error::the staging login is still in a report'
            rm -rf .lighthouseci/reports
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/reports
          retention-days: 30
          if-no-files-found: ignore

      - name: Lighthouse — budget
        run: npx --yes @lhci/cli@0.15.1 assert
